<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园讲座信息中心</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎤 校园讲座信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#lectures">讲座查询</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">统计图表</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d.html">三维报告厅</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- 首页标题 -->
    <section id="home" class="mb-5">
      <div class="p-4 p-md-5 mb-4 rounded-3 bg-light text-center">
        <h1 class="display-6 fw-bold">校园讲座信息与数据展示中心</h1>
        <p class="text-muted mb-0">查讲座、看统计、逛三维报告厅，一站式了解校园讲座动态</p>
      </div>

      <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">📅 讲座查询</h5>
              <p class="card-text small text-muted">按关键词搜索，按院系筛选</p>
              <a href="#lectures" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">📊 统计图表</h5>
              <p class="card-text small text-muted">ECharts 柱状图 + Chart.js 折线图</p>
              <a href="stats.html" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">🏛️ 三维报告厅</h5>
              <p class="card-text small text-muted">A-Frame 搭建的讲座场景</p>
              <a href="three-d.html" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 讲座查询：搜索 + 院系筛选 -->
    <section id="lectures" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">讲座查询</h2>

      <div class="row g-2 align-items-end mb-3">
        <div class="col-12 col-sm-auto">
          <label for="searchInput" class="form-label small text-muted mb-1">搜索讲座</label>
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="输入讲座名称或主讲人">
        </div>
        <div class="col-auto">
          <label for="deptFilter" class="form-label small text-muted mb-1">院系</label>
          <select id="deptFilter" class="form-select form-select-sm">
            <option value="all">全部院系</option>
          </select>
        </div>
        <div class="col-auto">
          <label for="statusFilter" class="form-label small text-muted mb-1">状态</label>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="all">全部状态</option>
            <option value="可预约">可预约</option>
            <option value="已满">已满</option>
            <option value="取消">取消</option>
          </select>
        </div>
        <div class="col-auto ms-auto">
          <span id="lectureCount" class="text-muted small">共 10 场</span>
        </div>
      </div>

      <p id="loadStatus" class="text-muted small mb-2">数据加载中…</p>
      <div class="row g-3" id="lectureList"></div>
      <p id="emptyTip" class="text-warning small d-none">未找到匹配的讲座，请尝试清空搜索或放宽筛选条件。</p>
    </section>

  </main>

  <footer class="bg-light text-center text-muted py-3">
    <div class="container">校园讲座信息中心 · 期末大作业</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
