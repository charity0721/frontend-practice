<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三维报告厅 - 校园讲座信息中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
  <!-- A-Frame 本地库（官方建议放在 head，先于场景注册） -->
  <script src="libs/aframe.min.js"></script>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎤 校园讲座信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#lectures">讲座查询</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">统计图表</a></li>
          <li class="nav-item"><a class="nav-link active" href="three-d.html">三维报告厅</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h2 class="h4 border-start border-4 border-primary ps-3 mb-2">三维报告厅</h2>
    <p class="text-muted small mb-3">A-Frame 搭建的简易讲座报告厅：讲台、投影幕、观众座椅和灯光。鼠标拖拽旋转视角，滚轮缩放。</p>

    <div class="rounded-3 border shadow-sm overflow-hidden" style="height:520px;">
      <a-scene embedded vr-mode-ui="enabled: false">
        <!-- 天空与地面 -->
        <a-sky color="#87CEEB"></a-sky>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="18" height="18" color="#d9e8c8"></a-plane>

        <!-- 讲台与投影幕 -->
        <a-box position="0 1.1 -9" width="3.2" height="0.7" depth="1.4" color="#8b5a2b"></a-box>
        <a-plane position="0 2.6 -9.8" width="4.5" height="2.8" color="#f2f2f2"></a-plane>
        <a-cylinder position="0 3.2 -9" radius="0.08" height="0.4" color="#555"></a-cylinder>

        <!-- 观众座椅：3 排 x 5 列 -->
        <a-box position="-2.2 0.4 -6" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="-1.1 0.4 -6" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="0 0.4 -6" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="1.1 0.4 -6" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="2.2 0.4 -6" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>

        <a-box position="-2.2 0.4 -4.2" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="-1.1 0.4 -4.2" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="0 0.4 -4.2" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="1.1 0.4 -4.2" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="2.2 0.4 -4.2" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>

        <a-box position="-2.2 0.4 -2.4" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="-1.1 0.4 -2.4" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="0 0.4 -2.4" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="1.1 0.4 -2.4" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>
        <a-box position="2.2 0.4 -2.4" width="0.7" height="0.5" depth="0.6" color="#5a7ba6"></a-box>

        <!-- 环境光 + 舞台聚光灯 -->
        <a-light type="ambient" color="#fff" intensity="0.5"></a-light>
        <a-light type="point" position="0 4.5 -8" color="#fff" intensity="1.2"></a-light>

        <!-- 讲台氛围灯（呼吸动画） -->
        <a-sphere position="0 3.6 -8.5" radius="0.15" color="#f7c948"
                  animation="property: scale; dir: alternate; dur: 1500; from: 1 1 1; to: 1.6 1.6 1.6; loop: true"></a-sphere>

        <!-- 相机 -->
        <a-camera position="0 1.7 2"></a-camera>
      </a-scene>
    </div>

    <div class="mt-3">
      <a href="index.html" class="btn btn-primary btn-sm">← 返回首页</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
