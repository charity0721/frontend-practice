    <h1>海埂大坝</h1>

    <h2>景点介绍</h2>
    <p>海埂大坝坐落于滇池北岸，是昆明热门的免费观景长廊，沿湖步道视野开阔，可远眺西山睡美人的连绵山影，坐拥滇池的辽阔湖景。</p >
    <p>每到冬季，大批红嘴鸥从西伯利亚飞来到此越冬。游人可以沿坝漫步，投喂海鸥，人与飞鸟相伴，是昆明冬日独有的浪漫风景。</p >  
    <p>大坝适合散步、骑行与等候日落。傍晚时分湖面被落日染成暖金色，晚风轻柔，是本地人休闲放松、打卡拍照的好去处。</p >

    <h2>游玩项目</h2>
    <ul>
        <li>湖边与红嘴鸥合照</li>
        <li>买小面包喂红嘴鸥</li>
        <li>坐缆车</li>
    </ul>
