<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你版校园信息中心</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <!-- ===== 导航栏：首页 / 自习室 / 统计 / 校园三维 四个入口 ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#home">🏫 校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#study">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- ===== 首页：标题 + 卡片区块 ===== -->
    <section id="home" class="mb-5">
      <div class="p-4 p-md-5 mb-4 rounded-3 bg-light text-center">
        <h1 class="display-6 fw-bold">迷你版校园公共信息与数据展示中心</h1>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">🏠 首页</h5>
              <a href="#home" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📚 自习室查询</h5>
              <a href="#study" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📊 使用统计</h5>
              <a href="#stats" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">🗺️ 校园三维</h5>
              <a href="three-d/scene.html" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 自习室查询：按楼层 / 开放状态筛选，即时生效 ===== -->
    <section id="study" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">自习室查询</h2>

      <!-- 筛选条件 -->
      <div class="row g-2 align-items-end mb-3">
        <div class="col-auto">
          <label for="floorFilter" class="form-label small text-muted mb-1">楼层</label>
          <select id="floorFilter" class="form-select form-select-sm">
            <option value="all">全部楼层</option>
            <option value="1">1 楼</option>
            <option value="2">2 楼</option>
            <option value="3">3 楼</option>
            <option value="4">4 楼</option>
          </select>
        </div>
        <div class="col-auto">
          <label for="statusFilter" class="form-label small text-muted mb-1">开放状态</label>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="all">全部状态</option>
            <option value="开放">开放</option>
            <option value="满座">满座</option>
            <option value="维修">维修</option>
          </select>
        </div>
        <div class="col-auto ms-auto">
          <span id="roomCount" class="text-muted small">共 8 间</span>
        </div>
      </div>

      <!-- 自习室卡片列表 -->
      <div class="row g-3" id="roomList"></div>
    </section>

    <!-- ===== 使用统计：加载 data.json，ECharts 柱状图 ===== -->
    <section id="stats" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">使用统计</h2>
      <p id="chartStatus" class="text-muted small mb-2">数据加载中…</p>
      <div id="usageChart" style="height:380px;"></div>
      <p class="text-muted small mt-2">单位：人次/日；数据来源：课程自建示例数据（2026-09-19 整理）。</p>
    </section>

    <!-- ===== 校园三维导览 ===== -->
    <section id="three-d" class="module-placeholder mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">校园三维导览</h2>
      <a href="three-d/scene.html" class="btn btn-primary btn-sm">进入三维导览 →</a>
    </section>

  </main>

  <footer class="bg-light text-center text-muted py-3">
    <div class="container">迷你版校园信息中心 · 课堂案例复现</div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ECharts（本地库，断网可用） -->
  <script src="libs/echarts.min.js"></script>
  <!-- 本页脚本：自习室筛选 + 使用统计图表 -->
  <script src="script.js"></script>
</body>
</html>
