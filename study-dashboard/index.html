<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人学习数据看板</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 自定义样式（在 Bootstrap 之后引入） -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 导航栏：首页 / 学习任务 / 学习统计 / 校园三维 ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#home">📊 学习数据看板</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#tasks">学习任务</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">学习统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- ===== 首页：标题 + 卡片区块 ===== -->
    <section id="home" class="mb-5">
      <div class="p-4 p-md-5 mb-4 rounded-3 bg-light text-center">
        <h1 class="display-6 fw-bold">个人学习数据看板</h1>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">🏠 首页</h5>
              <a href="#home" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📝 学习任务</h5>
              <a href="#tasks" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📈 学习统计</h5>
              <a href="#stats" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">🗺️ 校园三维</h5>
              <a href="three-d/scene.html" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 学习任务占位（第二步实现）===== -->
    <section id="tasks" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">学习任务</h2>
      <p class="text-muted">占位：第二步实现任务添加、搜索、删除，数据保存在 localStorage。</p>
    </section>

    <!-- ===== 学习统计占位（第二步实现）===== -->
    <section id="stats" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">学习统计</h2>
      <p class="text-muted">占位：第二步加载 data.json，用 ECharts 渲染每周学习时长柱状图。</p>
    </section>

    <!-- ===== 校园三维占位（第三步实现）===== -->
    <section id="three-d" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">校园三维导览</h2>
      <p class="text-muted">占位：第三步搬入课堂七的 A-Frame 校园场景。</p>
    </section>

  </main>

  <footer class="bg-light text-center text-muted py-3">
    <div class="container">个人学习数据看板 · 自主实践作品</div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
