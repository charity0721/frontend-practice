<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人学习数据看板</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 自定义样式（在 Bootstrap 之后引入） -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== 导航栏：首页 / 学习任务 / 学习统计 / 校园三维 ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="#home">📊 学习数据看板</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#tasks">学习任务</a></li>
          <li class="nav-item"><a class="nav-link" href="#stats">学习统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- ===== 首页：标题 + 卡片区块 ===== -->
    <section id="home" class="mb-5">
      <div class="p-4 p-md-5 mb-4 rounded-3 bg-light text-center">
        <h1 class="display-6 fw-bold">个人学习数据看板</h1>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">🏠 首页</h5>
              <a href="#home" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📝 学习任务</h5>
              <a href="#tasks" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📈 学习统计</h5>
              <a href="#stats" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">🗺️ 校园三维</h5>
              <a href="three-d/scene.html" class="btn btn-sm btn-outline-primary">进入</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 学习任务：添加 + 搜索 + 列表（localStorage）===== -->
    <section id="tasks" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">学习任务</h2>

      <!-- 添加任务表单 -->
      <form id="addForm" class="row g-2 mb-3 align-items-end">
        <div class="col-auto">
          <label for="taskName" class="form-label small text-muted mb-1">任务名称</label>
          <input type="text" class="form-control form-control-sm" id="taskName" placeholder="如：复习第三章">
        </div>
        <div class="col-auto">
          <label for="subject" class="form-label small text-muted mb-1">科目</label>
          <input type="text" class="form-control form-control-sm" id="subject" placeholder="如：前端">
        </div>
        <div class="col-auto">
          <label for="priority" class="form-label small text-muted mb-1">优先级</label>
          <select id="priority" class="form-select form-select-sm">
            <option value="高">高</option>
            <option value="中" selected>中</option>
            <option value="低">低</option>
          </select>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary btn-sm">添加任务</button>
        </div>
      </form>
      <p id="tip" class="text-danger small"></p>

      <!-- 搜索 -->
      <div class="mb-3">
        <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="输入任务名搜索…">
      </div>

      <!-- 任务列表 -->
      <div class="list-group" id="listWrap"></div>
    </section>

    <!-- ===== 学习统计：ECharts 柱状图 ===== -->
    <section id="stats" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">学习统计</h2>
      <p id="chartStatus" class="text-muted small mb-2">数据加载中…</p>
      <div id="studyChart" style="height:380px;"></div>
      <p class="text-muted small mt-2">单位：小时；数据来源：课程自建示例数据（2026-09-19 整理）。</p>
    </section>

    <!-- ===== 校园三维导览 ===== -->
    <section id="three-d" class="mb-5">
      <h2 class="h4 border-start border-4 border-primary ps-3 mb-3">校园三维导览</h2>
      <a href="three-d/scene.html" class="btn btn-primary btn-sm">进入三维导览 →</a>
    </section>

  </main>

  <footer class="bg-light text-center text-muted py-3">
    <div class="container">个人学习数据看板 · 自主实践作品</div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ECharts -->
  <script src="libs/echarts.min.js"></script>
  <!-- 本页脚本 -->
  <script src="js/app.js"></script>
</body>
</html>
