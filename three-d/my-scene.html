<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星球宇宙三维场景</title>
  <style> body { margin: 0; } </style>
</head>
<body>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050520);
scene.fog = new THREE.Fog(0x050520, 20, 60);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 4, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const sunLight = new THREE.DirectionalLight(0xfffbd0, 1);
sunLight.position.set(8, 5, 3);
scene.add(sunLight);

// 恒星
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1.2,32,32),
  new THREE.MeshStandardMaterial({color:0xffdd60, emissive:0xffdd60, emissiveIntensity:0.3})
);
scene.add(sunMesh);

// 行星公转组
const planetGroup = new THREE.Group();
scene.add(planetGroup);

// 岩石行星
const planet1 = new THREE.Mesh(
  new THREE.SphereGeometry(0.6,32,32),
  new THREE.MeshStandardMaterial({color:0x8d6e63})
);
planet1.position.x = 4.5;
planetGroup.add(planet1);

// 环状行星
const ringPlanet = new THREE.Mesh(
  new THREE.TorusGeometry(0.9,0.22,16,48),
  new THREE.MeshStandardMaterial({color:0x90caf9})
);
ringPlanet.position.x = 7;
planetGroup.add(ringPlanet);

// 小行星
const asteroid = new THREE.Mesh(
  new THREE.BoxGeometry(0.45,0.45,0.45),
  new THREE.MeshStandardMaterial({color:0x78909c})
);
asteroid.position.set(-5, 2, -2);
scene.add(asteroid);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// =========本次新增动画：公转、自转=========
const animate = () => {
  requestAnimationFrame(animate);
  controls.update();
  planetGroup.rotation.y += 0.004; // 行星组公转
  sunMesh.rotation.y += 0.006;    // 恒星自转
  asteroid.rotation.y += 0.01;    // 小行星自转
  renderer.render(scene, camera);
};
animate();
  </script>
</body>
</html>
