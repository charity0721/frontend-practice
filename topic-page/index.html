<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书影音推荐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-title">书影音推荐</div>
            <div class="nav-menu">
                <a href="#book">书籍</a>
                <a href="#movie">电影</a>
                <a href="#music">音乐</a>
            </div>
        </div>
    </nav>

    <section class="section-intro">
        <h1>书影音推荐清单</h1>
        <p>分享值得观看阅读收听的作品</p>
    </section>
    <div class="card-wrap">
        <div class="card" id="book">
            <span class="tag">书籍</span>
            <h3>夜晚的潜水艇</h3>
            <p>想象力丰富的短篇故事集。</p>
        </div>
        <div class="card">
            <span class="tag">书籍</span>
            <h3>小王子</h3>
            <p>关于爱与成长的童话。</p>
        </div>
        <div class="card" id="movie">
            <span class="tag">电影</span>
            <h3>寻梦环游记</h3>
            <p>讲述亲情与记忆的温暖动画。</p>
        </div>
        <div class="card">
            <span class="tag">电影</span>
            <h3>海街日记</h3>
            <p>记录姐妹平淡温馨的日常生活。</p>
        </div>
        <div class="card" id="music">
            <span class="tag">音乐</span>
            <h3>叙事民谣</h3>
            <p>带有故事感的舒缓歌曲。</p>
        </div>
        <div class="card">
            <span class="tag">音乐</span>
            <h3>治愈纯音乐</h3>
            <p>适合学习休息时聆听。</p>
        </div>
    </div>
    <footer>
        <p>响应式专题页面实践</p>
    </footer>
</body>
</html>
